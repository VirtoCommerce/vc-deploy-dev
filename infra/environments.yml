- name: vcpt-virtoozdev
  production: false
  gitops: true
  servicePlan: B1
  platform:
    dbProvider: AzureSQL Database
    headers:
      Cross-Origin-Resource-Policy: cross-origin
      Cross-Origin-Opener-Policy: unsafe-none
      Cross-Origin-Embedder-Policy: unsafe-none
    imageRepository: virtopaasregistrymain.azurecr.io/vcpt/virtooz-platform
    sqlReplica: false
    redis:
      service: redis-prod-vc02-redis-cluster.redis-cluster:6379
    config:
      # Forward headers to Nginx
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: true
      # Azure Active Directory login
      AzureAd__ApplicationId: 54cefda5-2d23-4518-ac12-f55a0e1225d4
      AzureAd__Enabled: true
      AzureAd__TenantId: bc03e660-5e3a-45c4-bf5c-b75489f78923
      AzureAd__Priority: 0
      PasswordLogin__Priority: 1
    secretConfig:
      APPLICATIONINSIGHTS_CONNECTION_STRING: vcpt-virtooz-appinsights-connection-string
  storefront:
    enabled: false
  customApps:
    app1:
      name: virtooz
      enabled: true
      imageRepository: virtopaasregistrymain.azurecr.io/vcpt/virtooz-app
      imageTag: 1.3.2
      servicePlan: B1
      type: standalone
      hostname: virtooz-dev.govirto.com
      probePath: /
      ingressPath: /
      config:
        LANGFUSE_PUBLIC_KEY: "pk-lf-359acc90-2825-4974-97b2-e0065322b973"
        LANGFUSE_BASE_URL: "https://us.cloud.langfuse.com"
        OTEL_EXPERIMENTAL_RESOURCE_DETECTORS: otel
        RESTARTED_AT: 2026-07-08T01:30
        VIRTO_OZ_CHECKPOINTER__TYPE: postgres
        VIRTO_OZ_LLM__SUBAGENT__TIMEOUT: 300
        VIRTO_OZ_MCP__AUTH__BASE_URL: https://virtooz-dev.govirto.com
        VIRTO_OZ_MCP__AUTH__STORAGE__AUTH__TYPE: entra_id
        VIRTO_OZ_MCP__AUTH__STORAGE__HOST: virtooz.eastus.redis.azure.net
        VIRTO_OZ_MCP__AUTH__STORAGE__PORT: 10000
        VIRTO_OZ_MCP__AUTH__STORAGE__TYPE: redis
      secretConfig:
        ANTHROPIC_API_KEY: vcpt-virtoozdev-anthropic-api-key
        OPENAI_API_KEY: vcpt-virtoozdev-openai-api-key
        APPLICATIONINSIGHTS_CONNECTION_STRING: vcpt-virtoozdev-appinsights-connection-string
        LANGFUSE_SECRET_KEY: vcpt-virtoozdev-langfuse-secret-key
        VIRTO_OZ_CHECKPOINTER__CONNECTION_STRING: vcpt-virtoozdev-checkpointer-connection-string
        VIRTO_OZ_MCP__AUTH__SIGNING_KEY: vcpt-virtoozdev-mcp-auth-signing-key
        VIRTO_OZ_MCP__AUTH__STORAGE__ENCRYPTION_KEY: vcpt-virtoozdev-mcp-auth-storage-encryption-key
    app2:
      enabled: false
  protectedParameters:
    - platform.image.tag
    - custom.app1.image.tag
  version: 3.240
