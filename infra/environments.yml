- name: vcptcore-aidemo
  gitops: true
  production: false
  servicePlan: B1
  platform:
    dbProvider: AzureSQL Database
    # Custom platform image (base platform + modules) built & pushed by deploy-backend.yml.
    # Was saas/platform:latest-stable — switched to the per-project custom image so
    # WhiteLabeling / PageBuilder / Pages (already listed in backend/packages.json) get installed.
    imageRepository: virtopaasregistrymain.azurecr.io/vcptcore/platform
    # imageTag is set by deploy-backend (CloudEnvSetParameter platform.image.tag=<ver>-<sha>)
    # and preserved across infra deploys via protectedParameters below.
    sqlReplica: false
    redis:
      service: redis-uat-vc03-redis-cluster.redis-cluster:6379
    config:
      APPINSIGHTS_INSTRUMENTATIONKEY: 2c32e0ab-0e97-4937-b03c-b2b1c7573454
  storefront:
    imageRepository: virtopaasregistrymain.azurecr.io/vcptcore/storefront
    imageTag: 6.0
    config:
      APPINSIGHTS_INSTRUMENTATIONKEY: adc98546-3f8a-4462-a0b2-7c822b5565ba
    themes:
      FE: https://github.com/VirtoCommerce/vc-frontend/releases/download/2.51.1/vc-frontend-2.51.1.zip
  customApps:
    app1:
      enabled: false
    app2:
      enabled: false
  routes:
  - host: front-vcptcore-aidemo.govirto.com
    root: FE
    paths:
    - path: /xapi
      route: platform
    - path: /files
      route: platform
    - path: /connect/token
      route: platform
    - path: /graphql
      route: platform
    - path: /revoke/token
      route: platform
    - path: /api/files
      route: platform
    - path: /externalsignin
      route: platform
    - path: /signin-oidc
      route: platform
    - path: /signin-google
      route: platform
  protectedParameters:
    - platform.image.tag
  version: 3.240
