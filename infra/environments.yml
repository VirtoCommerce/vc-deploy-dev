- name: vcptcore-selfdemo
  gitops: true
  production: false
  servicePlan: F1
  platform:
    #dbProvider: Azure Database for PostgreSQL
    imageRepository: virtopaasregistrymain.azurecr.io/vcptcore/platform
    imageTag: 3.811.0-alpha.12870-vcst-388-63cbde4f-27b60ad
    sqlReplica: false
    # config:
    #   Serilog__Using__0: Serilog.Sinks.Console

  storefront:
    enabled: false
    themes:
      B2B-store: https://vc3prerelease.blob.core.windows.net/packages/vc-theme-b2b-vue-2.0.0-pr-1136-1be8-1be89467.zip
  ingress: {}
  customApps:
    app1:
      name: vc-deploy-mcp
      enabled: true
      imageRepository: virtopaasregistrymain.azurecr.io/vcptcore/vc-deploy-mcp
      imageTag: 0.0.1-268b5fe
      servicePlan: B1
      type: standalone
      probePath: /health
      ingressPath: /
      config:
        GITHUB_DEPLOY_APP_ID: "5149179"
        GITHUB_DEPLOY_APP_INSTALLATION_ID: "166861133"
        GITHUB_THEME_APP_ID: "5149217"
        GITHUB_THEME_APP_INSTALLATION_ID: "167117030"
        # vc-deploy-mcp server settings (see mcp/vc-deploy-mcp/README.md in vc-self-demo).
        # It refuses to start without ENTRA_TENANT_ID and ENTRA_AUDIENCE.
        ENTRA_TENANT_ID: "bc03e660-5e3a-45c4-bf5c-b75489f78923"
        ENTRA_AUDIENCE: "api://vc-deploy-mcp"
        MCP_RESOURCE_URL: "https://vcptcore-selfdemo.govirto.com/mcp"
        VC_ENV_ALLOWLIST: "vcptcore-aidemo,vcptcore-aidemo2"
        # Writes stay off until Entra is configured (plan step 27).
        VC_ALLOW_WRITES: ""
        # PORT: "<port the platform routes to>"  # server default is 8787
      secretConfig:
        GITHUB_DEPLOY_APP_PRIVATE_KEY: github-deploy-app-private-key
        GITHUB_THEME_APP_PRIVATE_KEY: github-theme-app-private-key
    app2:
      enabled: false
  routes:
  - host: vcptcore-selfdemo.govirto.com
    root: B2B-store
    paths:
    - path: /xapi
      route: platform
    - path: /files
      route: platform
    - path: /connect/token
      route: platform
    - path: /graphql
      route: platform
    - path: /revoke/token
      route: platform
    - path: /api/files
      route: platform
    - path: /ucp
      route: platform
    - path: /.well-known/ucp
      route: platform
  protectedParameters:
   - platform.image.tag
   - storefront.image.tag
   #- themes.B2B-store
   # - custom.app1.image.tag  # off for now: the vc-deploy-mcp tag is set via imageTag in this file (VCST-5970)
  version: 3.208
