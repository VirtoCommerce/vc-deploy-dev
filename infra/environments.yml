- name: vcptcore-aidemo3
  gitops: true
  production: false
  servicePlan: B1
  platform:
    dbProvider: AzureSQL Database
    imageRepository: virtopaasregistrymain.azurecr.io/vcptcore/platform
    imageTag: 3.1071.0-f0623b3
    sqlReplica: false
    redis:
      service: redis-uat-vc03-redis-cluster.redis-cluster:6379
    config:
      APPINSIGHTS_INSTRUMENTATIONKEY: 2c32e0ab-0e97-4937-b03c-b2b1c7573454
      Seo__SeoInfoResolver__0: Pages
      Seo__SeoInfoResolver__1: ContentFile
      Seo__SeoInfoResolver__2: Catalog
      Seo__SeoInfoResolver__3: Brand
      Seo__SeoInfoResolver__4: Category
      Seo__SeoInfoResolver__5: CatalogProduct
      Search__ContentFullTextSearchEnabled: true
      # --- BOPIS dealer availability (added 2026-09-08) ---
      # Shipping 3.1005.0 ALREADY ships the PickupLocation index (document builder, request
      # builder, index fields) — no module upgrade is needed. PickupLocationIndexedSearchService
      # refuses to run without this key, so productPickupLocations / cartPickupLocations return
      # an EMPTY LIST with no error, the checkout pickup selector has no dealers, and the
      # dealer map has nothing to plot. The exception text names this exact key.
      Search__PickupLocationFullTextSearchEnabled: true
  storefront:
    # Same model as vcst-qa: no .NET storefront pod, the theme is served by the
    # `frontend` entry below (its name must match themes.<key> and routes[].root).
    enabled: false
    imageRepository: virtopaasregistrymain.azurecr.io/vcptcore/storefront
    imageTag: 6.0
    config:
      APPINSIGHTS_INSTRUMENTATIONKEY: adc98546-3f8a-4462-a0b2-7c822b5565ba
    themes:
      FE: https://vc3prerelease.blob.core.windows.net/packages/vc-theme-b2b-vue-2.59.0-pr-2494-935a-935ac19b.zip
  customApps:
    app1:
      enabled: false
    app2:
      enabled: false
  frontend:
  - name: FE
    prerender: true
  routes:
  - host: front-vcptcore-aidemo3.govirto.com
    root: FE
    paths:
    - path: /xapi
      route: platform
    - path: /files
      route: platform
    - path: /connect/token
      route: platform
    - path: /connect/authorize
      route: platform
    - path: /connect/session
      route: platform
    - path: /.well-known/openid-configuration
      route: platform
    - path: /.well-known/oauth-authorization-server
      route: platform
    - path: /.well-known/oauth-protected-resource
      route: platform
    - path: /.well-known/jwks
      route: platform
    - path: /graphql
      route: platform
    - path: /revoke/token
      route: platform
    - path: /api/files
      route: platform
    - path: /externalsignin
      route: platform
    - path: /signin-oidc
      route: platform
    - path: /signin-google
      route: platform
  protectedParameters:
    - platform.image.tag
    - themes.FE
  version: 3.231
