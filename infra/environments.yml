- name: vcpt-virtooz
  production: true
  gitops: true
  servicePlan: S1
  platform:
    dbProvider: Azure Database for PostgreSQL
    headers:
      Cross-Origin-Resource-Policy: cross-origin
      Cross-Origin-Opener-Policy: unsafe-none
      Cross-Origin-Embedder-Policy: unsafe-none
    imageRepository: virtopaasregistrymain.azurecr.io/vcpt/virtooz-platform
    sqlReplica: false
    redis:
      service: redis-prod-vc02-redis-cluster.redis-cluster:6379
    config:
      # Forward headers to Nginx
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: true
      # Azure Active Directory login
      AzureAd__ApplicationId: 54cefda5-2d23-4518-ac12-f55a0e1225d4
      AzureAd__Enabled: true
      AzureAd__TenantId: bc03e660-5e3a-45c4-bf5c-b75489f78923
      AzureAd__Priority: 0
      PasswordLogin__Priority: 1
      # Push notifications (platform core - SignalR)
      PushNotifications__ForceWebSockets: true
      PushNotifications__RedisBackplane__ChannelName: vcpt-virtooz-channel
      PushNotifications__ScalabilityMode: RedisBackplane
    secretConfig:
      APPLICATIONINSIGHTS_CONNECTION_STRING: vcpt-virtooz-appinsights-connection-string
      PushNotifications__HubUrl: vcpt-virtooz-push-notifications-hub
    databases: {}
  storefront:
    enabled: false
  customApps:
    app1:
      name: virtooz
      enabled: true
      imageRepository: virtopaasregistrymain.azurecr.io/vcpt/virtooz-app
      servicePlan: S1
      type: standalone
      hostname: virtooz.govirto.com
      probePath: /
      ingressPath: /
      config:
        LANGFUSE_PUBLIC_KEY: "pk-lf-0e66d160-0871-4cf6-91b8-db0fbf3b03b3"
        LANGFUSE_BASE_URL: "https://us.cloud.langfuse.com"
        # TENANTS__DEV__PLATFORM__URL: https://vcpt-virtooz.govirto.com
        # TENANTS__DEV__PLATFORM__AUTH__CLIENT_ID: 62f437db-98d8-4c80-b660-71e2fef900ea
        VIRTO_OZ_MCP__AUTH__BASE_URL: https://virtooz.govirto.com
      secretConfig:
        APPLICATIONINSIGHTS_CONNECTION_STRING: vcpt-virtooz-appinsights-connection-string
        LANGFUSE_SECRET_KEY: vcpt-virtooz-langfuse-secret-key
        #TENANTS__DEV__PLATFORM__AUTH__CLIENT_SECRET: vcpt-virtooz-virtooz-platform-client-secret
        VIRTO_OZ_MCP__AUTH__SIGNING_KEY: vcpt-virtooz-mcp-auth-signing-key
    app2:
      enabled: false
  protectedParameters:
    - platform.image.tag
    - custom.app1.image.tag
  version: 3.240
