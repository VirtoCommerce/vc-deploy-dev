name: Cloud MCP onX deployment

on:
  workflow_dispatch:
  push:
    paths:
      - 'mcp-onx/**'
    branches:
      - 'vcst-*'

jobs:
  gitops:
    runs-on: ubuntu-latest
    env:
      ARGO_APP_NAME: ${{ github.ref_name }}
      MCP_TAG: ''

    steps:
      - uses: actions/checkout@v6

      - name: Install vc-build
        run: |
          dotnet tool install --global VirtoCommerce.GlobalTool

      - name: Get MCP onX version
        run: |
          echo "MCP_TAG=$(jq -r '.Tag' ./mcp-onx/image.json)" >> $GITHUB_ENV

      - name: Update environment
        run: |
          export PARAMETER_NAME=$(echo "custom.mcp-onx.image.tag" | xargs)
          export PARAMETER_VALUE=$(echo "${{ env.MCP_TAG }}" | xargs)
          vc-build CloudEnvSetParameter -EnvironmentName ${{ env.ARGO_APP_NAME }} -CloudToken ${{ secrets.VCST_PLATFORM_TOKEN }} -HelmParameters $PARAMETER_NAME=$PARAMETER_VALUE
